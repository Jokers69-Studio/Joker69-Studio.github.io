name: Image Optimization

on:
  push:
    paths:
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - "**/*.gif"
      - "**/*.bmp"
      - "**/*.tiff"
      - ".imgbotconfig"
  pull_request:
    paths:
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - "**/*.gif"
      - "**/*.bmp"
      - "**/*.tiff"
      - ".imgbotconfig"
  workflow_dispatch:
    inputs:
      quality:
        description: "Image quality (1-100)"
        required: false
        default: "85"
        type: string
      format:
        description: "Output format"
        required: false
        default: "jpeg"
        type: choice
        options:
          - jpeg
          - png
          - webp
          - avif

jobs:
  optimize-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Install Sharp
        run: pnpm add sharp

      - name: Run image optimization
        run: |
          npx tsx scripts/optimize-images.ts \
            --quality=${{ github.event.inputs.quality || '85' }} \
            --format=${{ github.event.inputs.format || 'jpeg' }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit optimized images
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "🔧 Optimize images automatically

          - Reduced image file sizes
          - Improved loading performance
          - Maintained visual quality

          Generated by Jokers69 Studio Image Optimizer"

      - name: Push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: git push

      - name: Create optimization report
        if: always()
        run: |
          if [ -f "image-optimization-report.txt" ]; then
            echo "## 📊 Image Optimization Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            cat image-optimization-report.txt >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi
